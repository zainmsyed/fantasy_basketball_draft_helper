<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Draft Helper - Frontend (Phase 1)</title>
  </head>
  <body class="bg-base-100 min-h-screen">
  <div id="app" x-data="draftHelper()" x-init="init()" class="container mx-auto px-4 py-6">
      <!-- Top Controls -->
      <div class="card bg-base-200 shadow-lg mb-6 p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">CSV Upload (Phase 2)</span></label>
            <input type="file" class="file-input file-input-bordered" disabled />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Stats View</span></label>
            <div class="flex items-center gap-2">
              <select x-model="activeStatView" @change="changeStatView" class="select select-bordered">
              <option value="2024-25">2024-25 Actual</option>
              <option value="2025-26">2025-26 Projected</option>
            </select>
              <svg x-show="loading" class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </div>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Search Player</span></label>
            <input x-model="searchQuery" @input="debounceSearch" type="text" placeholder="Enter player name..." class="input input-bordered" aria-label="Search players by name" role="searchbox" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Position</span></label>
            <div class="flex gap-2 flex-wrap" role="group" aria-label="Filter by position">
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="PG" class="mr-2" />PG</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="SG" class="mr-2" />SG</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="SF" class="mr-2" />SF</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="PF" class="mr-2" />PF</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="C" class="mr-2" />C</label>
              <button type="button" @click="resetFilters()" class="btn btn-ghost btn-sm ml-2">Reset</button>
            </div>
          </div>
          <div class="form-control" x-show="showProfiler" style="display:flex;align-items:center">
            <label class="label"><span class="label-text">Dev Profiler</span></label>
            <div class="flex items-center gap-2">
              <button type="button" @click="runProfiler()" :class="profilerRunning ? 'btn btn-disabled' : 'btn btn-primary'" class="btn">Run Profiler</button>
              <template x-if="profilerResults && profilerResults.summary">
                <span class="text-sm">p50: <span x-text="(profilerResults.summary.p50 || 0).toFixed(1)"></span>ms</span>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Player Table -->
      <div class="card bg-base-100 shadow-lg">
        <div class="card-body">
          <h2 class="card-title">Player Rankings</h2>
          <template x-if="!storageAvailable">
            <div class="alert alert-warning mb-4">
              <div>
                <span>Browser storage unavailable — settings will not persist across sessions.</span>
              </div>
            </div>
          </template>
          <template x-if="errorMessage">
            <div class="alert alert-error mb-4">
              <div>
                <span x-text="errorMessage"></span>
              </div>
              <div class="flex-none">
                <button @click="clearError()" class="btn btn-sm btn-ghost">Dismiss</button>
              </div>
            </div>
          </template>
          <div class="relative w-full">
            <div id="player-table" class="w-full"></div>
            <div x-show="loading" class="absolute inset-0 bg-base-100/60 flex items-center justify-center" style="backdrop-filter: blur(2px);" role="status" aria-live="polite" aria-label="Loading data">
              <div class="flex items-center gap-2">
                <svg class="animate-spin h-6 w-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                <span class="text-sm">Loading data…</span>
              </div>
            </div>
            <template x-if="table && table.getData && table.getData().length === 0 && !loading">
              <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="text-center text-sm text-neutral">
                  <div>No players match the current filters.</div>
                  <div class="mt-2">
                    <button @click="resetFilters()" class="btn btn-xs btn-outline">Clear filters</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
