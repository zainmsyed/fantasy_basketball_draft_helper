<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketball Draft Helper - Frontend (Phase 1)</title>
  </head>
  <body class="bg-base-100 min-h-screen">
  <div id="app" x-data="draftHelper()" x-init="init()" class="container mx-auto px-4 py-6">
      <!-- Top Controls -->
      <div class="card bg-base-200 shadow-lg mb-6 p-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="form-control">
            <label class="label"><span class="label-text">CSV Upload (Phase 2)</span></label>
            <input aria-label="Upload CSV file" type="file" @change="handleFile($event)" accept="text/csv" class="file-input file-input-bordered" />
            <p class="text-xs text-neutral mt-2">Upload a CSV exported from your roster or draftboard. We'll attempt to auto-detect columns.</p>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Stats View</span></label>
            <div class="flex items-center gap-2">
              <select aria-label="Select stats view" x-model="activeStatView" @change="changeStatView" class="select select-bordered">
              <option value="2024-25">2024-25 Actual</option>
              <option value="2025-26">2025-26 Projected</option>
            </select>
              <svg x-show="loading" class="animate-spin h-5 w-5 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
            </div>
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Search Player</span></label>
            <input x-model="searchQuery" @input="debounceSearch" type="text" placeholder="Enter player name..." class="input input-bordered" aria-label="Search players by name" role="searchbox" />
          </div>

          <div class="form-control">
            <label class="label"><span class="label-text">Position</span></label>
            <div class="flex gap-2 flex-wrap" role="group" aria-label="Filter by position">
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="PG" class="mr-2" />PG</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="SG" class="mr-2" />SG</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="SF" class="mr-2" />SF</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="PF" class="mr-2" />PF</label>
              <label class="cursor-pointer" style="display:flex;align-items:center"><input type="checkbox" x-model="positionFilters" @change="applyFilters" value="C" class="mr-2" />C</label>
              <button type="button" @click="resetFilters()" class="btn btn-ghost btn-sm ml-2">Reset</button>
            </div>
          </div>
          <div class="form-control" x-show="showProfiler" style="display:flex;align-items:center">
            <label class="label"><span class="label-text">Dev Profiler</span></label>
            <div class="flex items-center gap-2">
              <button type="button" @click="runProfiler()" :class="profilerRunning ? 'btn btn-disabled' : 'btn btn-primary'" class="btn">Run Profiler</button>
              <template x-if="profilerResults && profilerResults.summary">
                <span class="text-sm">p50: <span x-text="(profilerResults.summary.p50 || 0).toFixed(1)"></span>ms</span>
              </template>
            </div>
          </div>
        </div>
      </div>

      <!-- Player Table -->
      <div class="card bg-base-100 shadow-lg mb-6" x-show="uploadedCSV" style="display:none">
        <div class="card-body">
          <h3 class="card-title">Column Mapping</h3>
          <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div class="form-control">
              <label class="label"><span class="label-text">Player Name Column</span></label>
              <select aria-label="Player name column" class="select select-bordered" x-model="columnMapper.mapping.playerNameColumn">
                <option value="">-- select --</option>
                <template x-for="c in csvColumns" :key="c">
                  <option x-text="c" :value="c"></option>
                </template>
              </select>
            </div>

            <div class="form-control">
              <label class="label"><span class="label-text">Team Column</span></label>
              <select aria-label="Team column" class="select select-bordered" x-model="columnMapper.mapping.teamColumn">
                <option value="">-- select --</option>
                <template x-for="c in csvColumns" :key="c">
                  <option x-text="c" :value="c"></option>
                </template>
              </select>
            </div>

            <div class="form-control">
              <label class="label"><span class="label-text">Position Column</span></label>
              <select aria-label="Position column" class="select select-bordered" x-model="columnMapper.mapping.positionColumn">
                <option value="">-- select --</option>
                <template x-for="c in csvColumns" :key="c">
                  <option x-text="c" :value="c"></option>
                </template>
              </select>
            </div>

            <div class="form-control">
              <label class="label"><span class="label-text">Rank Column</span></label>
              <select aria-label="Rank column" class="select select-bordered" x-model="columnMapper.mapping.rankColumn">
                <option value="">-- select --</option>
                <template x-for="c in csvColumns" :key="c">
                  <option x-text="c" :value="c"></option>
                </template>
              </select>
            </div>
          </div>

            <div class="mt-4 flex gap-2">
            <button class="btn" @click="saveMapping()">Save Mapping</button>
            <button class="btn btn-primary" @click="applyMappingPreview()">Match Players</button>
            <button class="btn btn-success" @click="uiConfirmUpload()" :disabled="!mappingComplete()">Save Integrated List</button>
            <button class="btn btn-outline" @click="transformUploadedRows()">Preview Rows</button>
            <button class="btn btn-sm btn-error ml-2" @click="openClearUploadConfirm()">Clear Upload Data</button>
            <div class="ml-4 flex items-center gap-2">
              <button class="btn btn-sm" :class="viewMode==='rankings'?'btn-active':''" @click="showRankingsView()">Show Rankings</button>
              <button class="btn btn-sm" :class="viewMode==='integrated'?'btn-active':''" @click="applyIntegratedToTable('saved')" :disabled="!(lastIntegratedPlayers && lastIntegratedPlayers.length)">Show Integrated</button>
              <button class="btn btn-sm" @click="applyIntegratedToTable('preview')" :disabled="!(integratedPreview && integratedPreview.length)">Load Preview In Table</button>
            </div>
            <template x-if="mappingPreview">
              <div class="badge badge-outline">Matches: <span x-text="mappingPreview.length"></span></div>
            </template>
            <div class="ml-4" x-show="matching" style="display:inline-block">
              <svg class="animate-spin h-5 w-5 text-primary inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
              <span class="text-sm ml-2">Matching players…</span>
            </div>

            <template x-if="lastMatchSummary">
              <div class="alert alert-info ml-4">
                <div class="text-xs">
                  <strong>Matched</strong> <span x-text="lastMatchSummary.matched"></span>/<span x-text="lastMatchSummary.total"></span>
                  <span class="ml-2">Ambiguous: <span x-text="lastMatchSummary.ambiguous"></span></span>
                  <span class="ml-2">Unmatched: <span x-text="lastMatchSummary.unmatched"></span></span>
                  <span class="ml-4 badge" :class="viewMode==='integrated' ? 'badge-success' : 'badge-ghost'" x-text="viewMode==='integrated' ? 'Integrated view' : 'Rankings view'"></span>
                  <template x-if="viewMode==='integrated' && currentIntegratedSource==='preview'">
                    <button class="btn btn-sm btn-success ml-4" @click="saveCurrentPreview()">Save This Preview</button>
                  </template>
                </div>
              </div>
            </template>

            <!-- Success toast -->
            <div x-show="showSuccessToast" class="toast toast-top toast-end" style="position:fixed;top:1rem;right:1rem;z-index:60" x-transition>
              <div class="alert alert-success">
                <div>
                  <span x-text="successMessage"></span>
                </div>
              </div>
            </div>
          </div>

          

          <!-- Re-upload confirmation modal (overwrite existing saved draft) -->
          <template x-if="showReuploadModal">
            <div class="fixed inset-0 flex items-center justify-center z-50">
              <div class="absolute inset-0 bg-black opacity-40"></div>
              <div class="bg-base-100 rounded shadow-lg p-6 z-10 w-11/12 md:w-1/3">
                <h3 class="text-lg font-bold">Overwrite saved draft?</h3>
                <div class="mt-4">
                  <p>There is an existing saved draft in your browser. Uploading now will overwrite the saved draft. Do you want to proceed?</p>
                </div>
                <div class="mt-4 flex gap-2 justify-end">
                  <button class="btn btn-ghost" @click="showReuploadModal = false">Cancel</button>
                  <button class="btn btn-primary" @click="proceedAfterReuploadModal()">Yes, overwrite</button>
                </div>
              </div>
            </div>
          </template>

          <!-- Clear upload data confirmation modal -->
          <template x-if="showClearUploadConfirm">
            <div class="fixed inset-0 flex items-center justify-center z-50">
              <div class="absolute inset-0 bg-black opacity-40"></div>
              <div class="bg-base-100 rounded shadow-lg p-6 z-10 w-11/12 md:w-1/3">
                <h3 class="text-lg font-bold">Clear saved upload data</h3>
                <div class="mt-4">
                  <p>Are you sure you want to remove saved upload data (integrated players, mapping, overrides)? This cannot be undone.</p>
                </div>
                <div class="mt-4 flex gap-2 justify-end">
                  <button class="btn btn-ghost" @click="showClearUploadConfirm = false">Cancel</button>
                  <button class="btn btn-error" @click="doClearUploadData()">Clear data</button>
                </div>
              </div>
            </div>
          </template>

          <template x-if="uploadedFileName">
            <div class="mt-4 text-sm text-neutral">
              <div>File: <strong x-text="uploadedFileName"></strong></div>
              <div>Size: <strong x-text="(uploadedFileSize/1024).toFixed(1) + ' KB'"></strong></div>
              <div>Rows: <strong x-text="uploadedRowCount"></strong></div>
              <div>Parse time: <strong x-text="parseTimeMs + ' ms'"></strong></div>
              <template x-if="fileWarnings && fileWarnings.length">
                <div class="alert alert-warning mt-2">
                  <ul class="list-disc list-inside">
                    <template x-for="w in fileWarnings" :key="w">
                      <li x-text="w"></li>
                    </template>
                  </ul>
                  <template x-if="uploadedRowCount > 500">
                    <div class="mt-2 flex gap-2">
                      <button class="btn btn-sm btn-outline" @click="trimToTopN(250)">Trim to top 250</button>
                      <button class="btn btn-sm btn-ghost" @click="trimToTopN(200)">Trim to top 200</button>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
          <!-- Validation modal -->
          <template x-if="showValidationModal">
            <div role="dialog" aria-modal="true" aria-labelledby="validation-modal-title" class="fixed inset-0 flex items-center justify-center z-50">
              <div class="absolute inset-0 bg-black opacity-40"></div>
              <div class="bg-base-100 rounded shadow-lg p-6 z-10 w-11/12 md:w-1/2">
                <h3 id="validation-modal-title" class="text-lg font-bold">Validation Report</h3>
                <div class="mt-4">
                  <p>Total players: <strong x-text="lastValidationReport && lastValidationReport.totalPlayers"></strong></p>
                  <p class="text-error" x-show="lastValidationReport && lastValidationReport.errorCount > 0">Errors: <strong x-text="lastValidationReport && lastValidationReport.errorCount"></strong></p>
                  <p class="text-warning" x-show="lastValidationReport && lastValidationReport.warningCount > 0">Warnings: <strong x-text="lastValidationReport && lastValidationReport.warningCount"></strong></p>
                </div>
                <div class="mt-4 flex gap-2 justify-end">
                  <button aria-label="Cancel validation" class="btn btn-ghost" @click="showValidationModal = false">Cancel</button>
                  <button aria-label="Proceed despite warnings" class="btn btn-primary" @click="proceedAfterValidationModal()">Proceed anyway</button>
                </div>
              </div>
            </div>
          </template>

          <!-- Large file performance modal -->
          <template x-if="showLargeFileModal">
            <div role="dialog" aria-modal="true" aria-labelledby="large-file-modal-title" class="fixed inset-0 flex items-center justify-center z-50">
              <div class="absolute inset-0 bg-black opacity-40"></div>
              <div class="bg-base-100 rounded shadow-lg p-6 z-10 w-11/12 md:w-1/2">
                <h3 id="large-file-modal-title" class="text-lg font-bold">Large file detected</h3>
                <div class="mt-4">
                  <p>We detected <strong x-text="uploadedRowCount"></strong> rows in your CSV. Processing very large files can be slow in the browser and may impact responsiveness.</p>
                  <p class="mt-2">Recommended: trim to the top 200–250 players for best performance during matching and validation.</p>
                </div>
                <div class="mt-4 flex gap-2 justify-end">
                  <button aria-label="Continue without trimming" class="btn btn-ghost" @click="showLargeFileModal = false">Continue without trimming</button>
                  <button aria-label="Trim to top 250" class="btn btn-outline" @click="trimToTopN(250); showLargeFileModal = false">Trim to top 250</button>
                  <button aria-label="Trim to top 200" class="btn btn-primary" @click="trimToTopN(200); showLargeFileModal = false">Trim to top 200</button>
                </div>
              </div>
            </div>
          </template>

          <template x-if="parseErrors && parseErrors.length">
            <div class="mt-4 alert alert-error">
              <div class="font-medium">Parsing errors detected</div>
              <ul class="list-disc list-inside text-sm mt-2">
                <template x-for="e in parseErrors" :key="JSON.stringify(e)">
                  <li><strong>Row <span x-text="e.row"></span>:</strong> <span x-text="e.message"></span></li>
                </template>
              </ul>
            </div>
          </template>

          <template x-if="previewRows && previewRows.length">
            <div class="mt-4">
              <h4 class="text-sm font-medium">CSV Preview (first 10 rows)</h4>
              <div class="overflow-auto mt-2">
                <table class="table table-compact w-full">
                  <thead>
                    <tr>
                      <template x-for="c in csvColumns" :key="c">
                        <th x-text="c"></th>
                      </template>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="r in previewRows" :key="JSON.stringify(r)">
                      <tr>
                        <template x-for="c in csvColumns" :key="c">
                          <td x-text="r[c]"></td>
                        </template>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
          <template x-if="lastIntegratedPlayers && lastIntegratedPlayers.length">
            <div class="mt-4 alert alert-success">
              <div>Last upload saved: <strong x-text="lastIntegratedPlayers.length"></strong> players</div>
            </div>
          </template>
          <template x-if="!mappingComplete()">
            <div class="mt-2 text-sm text-warning">Mapping incomplete — map required fields (name, team, position, plus at least pts/ast/reb) before confirming upload.</div>
          </template>
          <template x-if="transformedUploadedPlayers && transformedUploadedPlayers.length">
            <div class="mt-2 alert alert-info">Transformed rows: <strong x-text="transformedUploadedPlayers.length"></strong></div>
          </template>

          <template x-if="mappingPreview && mappingPreview.length">
            <div class="mt-4">
              <h4 class="text-sm font-medium">Sample matches</h4>
              <div class="mt-2 mb-2">
                <button class="btn btn-sm btn-warning" @click="bulkApplyOverride('all_unmatched', 0)">Apply top alternative to all unmatched</button>
                <span class="text-xs text-neutral ml-2">(Applies the first alternative for each unmatched player)</span>
                <div class="mt-2">
                  <label class="label"><span class="label-text">Bulk apply to selected rows</span></label>
                  <div class="flex gap-2 items-center">
                    <select x-model="bulkAlternativeIndex" class="select select-sm select-bordered">
                      <option value="0">Alternative #1</option>
                      <option value="1">Alternative #2</option>
                      <option value="2">Alternative #3</option>
                    </select>
                    <button class="btn btn-sm btn-primary" @click="bulkApplySelected()">Apply to selected</button>
                    <button class="btn btn-sm btn-ghost" @click="selectedPreviewIndexes = []">Clear selection</button>
                  </div>
                </div>
              </div>
              <ul class="list-none p-0 text-sm">
                <template x-for="(m, i) in mappingPreview.slice(0,12)" :key="JSON.stringify(m.csvPlayer)">
                  <li class="mb-3">
                    <div class="mb-1">
                      <label style="display:flex;align-items:center">
                        <input type="checkbox" :value="i" x-model="selectedPreviewIndexes" class="mr-2" />
                        <span class="text-xs text-neutral">Select</span>
                      </label>
                    </div>
                    <div class="flex items-center justify-between">
                      <div>
                        <span class="font-medium" x-text="m.csvPlayer.name || (m.csvPlayer && m.csvPlayer[Object.keys(m.csvPlayer)[0]])"></span>
                        <span class="text-sm text-neutral"> — matched to: <span x-text="m.historicalMatch ? m.historicalMatch.name : '—' "></span></span>
                        <span class="text-sm"> (<span x-text="m.confidence"></span>%)</span>
                      </div>
                      <div>
                        <template x-if="((m.confidence < 90) || (m.matchType === 'ambiguous')) && m.alternatives && m.alternatives.length">
                          <button class="btn btn-xs btn-outline" @click="openOverride(i)">Override</button>
                        </template>
                      </div>
                    </div>

                    <template x-if="overrideIndex === i">
                      <div class="mt-2 p-2 border rounded bg-base-200">
                        <div class="text-sm mb-2">Select alternative match:</div>
                        <template x-for="(a, ai) in m.alternatives" :key="a.player.name">
                          <label style="display:block" class="cursor-pointer">
                            <input type="radio" :name="'alt-choices-'+i" :value="ai" @change="setOverrideChoice(ai)" :checked="overrideChoice === ai" />
                            <span class="ml-2" x-text="a.player.name + ' (' + a.confidence + '%)' "></span>
                          </label>
                        </template>
                        <div class="mt-2 flex gap-2">
                          <button class="btn btn-sm btn-primary" @click="applyOverride()">Apply</button>
                          <button class="btn btn-sm btn-ghost" @click="closeOverride()">Cancel</button>
                        </div>
                      </div>
                    </template>
                  </li>
                </template>
              </ul>
            </div>
          </template>

          <template x-if="integratedPreview && integratedPreview.length">
            <div class="mt-6">
              <h4 class="text-sm font-medium">Integrated Preview (first 10)</h4>
              <div class="overflow-auto mt-2">
                <table class="table table-compact w-full">
                  <thead>
                    <tr>
                      <th>Name</th>
                      <th>Team</th>
                      <th>Pos</th>
                      <th>Expert Rank</th>
                      <th>Match%</th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="p in integratedPreview.slice(0,10)" :key="p.id">
                      <tr>
                        <td x-text="p.name"></td>
                        <td x-text="p.team"></td>
                        <td x-text="(Array.isArray(p.positions) ? p.positions.join('/') : (p.position || ''))"></td>
                        <td x-text="p.expertRank ?? ''"></td>
                        <td x-text="p.matchConfidence + '%' "></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>
        </div>
      </div>
      <div class="card bg-base-100 shadow-lg">
        <div class="card-body">
          <h2 class="card-title">Player Rankings</h2>
          <template x-if="!storageAvailable">
            <div class="alert alert-warning mb-4">
              <div>
                <span>Browser storage unavailable — settings will not persist across sessions.</span>
              </div>
            </div>
          </template>
          <template x-if="errorMessage">
            <div class="alert alert-error mb-4" role="status" aria-live="assertive" x-transition>
              <div>
                <span x-text="errorMessage"></span>
              </div>
              <div class="flex-none">
                <button @click="clearError()" class="btn btn-sm btn-ghost">Dismiss</button>
              </div>
              <div class="w-full mt-2">
                <template x-if="errorContext === 'parse'">
                  <div class="flex gap-2">
                    <button class="btn btn-sm btn-primary" @click="retryParse()">Try again (parse)</button>
                    <span class="text-xs self-center text-neutral">If the upload failed to decode, reselect the CSV or try again.</span>
                  </div>
                </template>
                <template x-if="errorContext === 'save'">
                  <div class="flex gap-2">
                    <button class="btn btn-sm btn-primary" @click="retrySave()">Try again (save)</button>
                    <button class="btn btn-sm btn-outline" @click="retrySaveAfterClear()">Clear saved data and retry</button>
                    <span class="text-xs self-center text-neutral">If storage quota is full, clearing saved drafts may help.</span>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <div class="relative w-full">
            <div id="player-table" class="w-full"></div>
            <div x-show="loading" class="absolute inset-0 bg-base-100/60 flex items-center justify-center" style="backdrop-filter: blur(2px);" role="status" aria-live="polite" aria-label="Loading data">
              <div class="flex items-center gap-2">
                <svg class="animate-spin h-6 w-6 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
                </svg>
                <span class="text-sm">Loading data…</span>
              </div>
            </div>
            <template x-if="table && table.getData && table.getData().length === 0 && !loading">
              <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="text-center text-sm text-neutral">
                  <div>No players match the current filters.</div>
                  <div class="mt-2">
                    <button @click="resetFilters()" class="btn btn-xs btn-outline">Clear filters</button>
                  </div>
                </div>
              </div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
